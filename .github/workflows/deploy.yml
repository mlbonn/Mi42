name: Deploy FRIDAY CRM to Production Server

on:
  push:
    branches:
      - main  # Workflow startet bei Push in main Branch
  workflow_dispatch:  # Ermöglicht manuelles Triggern über GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
      
      - name: Deploy auf Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            # Wechsel ins Projektverzeichnis
            cd /home/manus02/friday-crm
            
            # Git Pull (neueste Änderungen holen)
            git stash
            git pull origin main
            
            # Dependencies installieren
            pnpm install
            
            # Build-Cache löschen
            rm -rf client/dist
            rm -rf dist
            
            # Client Build (Vite/React Frontend)
            pnpm run build:client
            
            # Server Build (Express/tRPC Backend)
            pnpm run build:server
            
            # PM2 Restart (Neustart der Anwendung)
            pm2 restart friday-crm
            
            # Status ausgeben
            pm2 status
            
            echo "✅ Deployment erfolgreich abgeschlossen!"
